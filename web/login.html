<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>账号登录 · 关务预审工作台</title>
    <script src="/app/assets/appearance.js"></script>
    <link rel="stylesheet" href="/app/assets/production.css" />
  </head>
  <body class="access-page">
    <a class="skip-link" href="#username">跳到账号登录</a>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
        </span>
        <div>
          <strong>关务预审工作台</strong>
          <small lang="en">CUSTOMS DESK</small>
        </div>
      </div>
      <label class="theme-control">
        <span>主题</span>
        <select data-theme-picker aria-label="界面主题">
          <option value="harbor">海港青</option>
          <option value="ledger">档案棕</option>
          <option value="night">夜航蓝</option>
        </select>
      </label>
    </header>
    <main class="access-main">
      <div class="access-spread">
        <div class="atlas" aria-hidden="true">
          <div class="atlas-bar">
            <span>
              FIELD ATLAS
              <b>/</b>
              关务图志
            </span>
            <span>PLATE 01</span>
          </div>
          <div class="atlas-title">
            <span class="atlas-kicker">PORT OF ENTRY</span>
            <p>
              通关作业志
              <span>。</span>
            </p>
            <div class="atlas-caption">单证流转，逐项有据。</div>
          </div>
          <svg
            class="port-plate"
            viewBox="0 0 600 270"
            fill="none"
            focusable="false"
            xmlns="http://www.w3.org/2000/svg"
          >
            <title>港口集装箱轴测手稿</title>
            <defs>
              <pattern id="sea" width="18" height="10" patternUnits="userSpaceOnUse">
                <path d="m0 8 6-2 5 1 6-2" stroke="currentColor" opacity=".27" stroke-width=".7" />
              </pattern>
              <g id="cargo" stroke="currentColor" stroke-linejoin="round" stroke-width="1.4">
                <path d="m0 27 51-25 81 33-52 27Z" class="cargo-roof" />
                <path d="m0 27 80 35v35L0 61Z" class="cargo-front" />
                <path d="m80 62 52-27v35L80 97Z" class="cargo-end" />
                <path
                  d="m5 26 77 32m-66-37 77 32m-66-37 77 32m-66-38 77 32m-66-38 77 32M7 34v24m9-20v24m9-20v24m9-20v24m9-20v24m9-20v24m9-20v24m9-19v23m17-24v27m8-31v27m8-31v27m8-31v27m8-31v27m8-31v27"
                  stroke-width=".9"
                />
              </g>
            </defs>
            <path d="M-50 148 310 0l330 125-349 174Z" fill="url(#sea)" />
            <g stroke="currentColor" opacity=".4" stroke-width=".8" stroke-dasharray="3 5">
              <path d="M16 242 505 29M-20 92l465 184M163 266 574 88M48 53l515 205" />
            </g>
            <path d="m51 141 196-88 271 105-196 95Z" class="cargo-front" stroke="currentColor" />
            <path d="m51 141 271 112 196-95v8l-196 95L51 149Z" class="cargo-end" stroke="currentColor" />
            <g opacity=".62" stroke="currentColor">
              <path d="m73 139 249 103 170-82M75 147l247 102 177-86" stroke-width=".8" />
              <path d="m420 168 35 14m-48-8 35 14m-46-9 33 14m-46-9 33 14" stroke-width="2" />
            </g>
            <use href="#cargo" transform="translate(206 48)" />
            <use href="#cargo" transform="translate(291 83)" />
            <use href="#cargo" transform="translate(151 77)" />
            <use href="#cargo" transform="translate(151 42)" />
            <use href="#cargo" transform="translate(237 112)" />
            <g stroke="currentColor" stroke-width="1" opacity=".8">
              <path d="M212 49V19h39m139 100 29-30h45m-278 70-41 24H80" />
              <circle cx="212" cy="49" r="2.2" />
              <circle cx="390" cy="119" r="2.2" />
            </g>
            <g class="plate-label">
              <text x="256" y="22">C / 01</text>
              <text x="466" y="92">C / 02</text>
              <text x="49" y="187">QUAY</text>
            </g>
          </svg>
          <div class="atlas-foot">
            <span>
              FIG. 01
              <i></i>
              港区装箱示意
            </span>
            <div class="scale-rule"></div>
          </div>
        </div>
        <section class="access-form-side" aria-labelledby="login-heading">
          <div class="access-form-inner">
            <p class="eyebrow">
              <span class="index-dash"></span>
              WORKSPACE ACCESS
            </p>
            <h1 id="login-heading">登录工作台</h1>
            <p class="access-intro">使用分配的业务账号，处理单证预审与人工复核。</p>
            <form id="login-form" method="post" action="/login/">
              <label for="username">账号</label>
              <input
                id="username"
                name="username"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                placeholder="输入业务账号"
                required
              />
              <label for="password">密码</label>
              <div class="password-field">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="输入密码"
                  required
                />
                <button
                  id="toggle-password"
                  type="button"
                  aria-controls="password"
                  aria-pressed="false"
                  aria-label="显示密码"
                >
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="2.8" />
                    <path class="eye-slash" d="m3 3 18 18" />
                  </svg>
                </button>
              </div>
              <p id="login-feedback" class="login-feedback" role="alert" hidden></p>
              <button id="sign-in" class="primary sign-in" type="submit" disabled>
                <span>登录</span>
                <span aria-hidden="true">→</span>
              </button>
            </form>
            <noscript><p class="error">请启用 JavaScript 后重新打开此页以登录。</p></noscript>
            <p class="access-help">还没有账号，或忘记密码？请联系业务管理员。</p>
          </div>
        </section>
      </div>
      <footer class="folio-footer">
        <span>
          关务预审工作台
          <i>/</i>
          业务访问入口
        </span>
        <span lang="en">
          CUSTOMS DESK
          <i>·</i>
          ACCESS
        </span>
      </footer>
    </main>
    <script type="module" src="/app/assets/login.js"></script>
  </body>
</html>
