<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关务审核工作台</title>
  <link rel="stylesheet" href="/app/assets/production.css">
  <link rel="stylesheet" href="/app/assets/styles/messages.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">关</span><div><strong>关务审核工作台</strong><small>单证预审与人工审核</small></div></div>
    <div class="account"><span id="identity"></span><button id="messages-toggle" type="button" hidden aria-expanded="false" aria-controls="messages-area">消息 <span id="messages-count" class="p19-badge">0</span></button><button id="logout" type="button" hidden>退出</button></div>
  </header>
  <main>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div id="messages-area" hidden></div>
    <section id="login-panel" class="login-panel">
      <h1>登录</h1>
      <form id="login-form">
        <label>账号<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">登录</button>
      </form>
    </section>
    <div id="workspace" class="workspace" hidden>
      <aside>
        <div class="section-heading"><h2>任务</h2><button id="refresh" type="button" title="刷新任务">刷新</button></div>
        <div id="task-list"></div><button id="more-tasks" type="button" hidden>加载更多</button>
        <div id="claim-area" hidden><div class="section-heading"><h2>待认领</h2></div><div id="claim-list"></div>
          <button id="more-claims" type="button" hidden>加载更多</button></div>
      </aside>
      <div class="content">
        <section id="upload-area" hidden>
          <div class="section-heading"><h2>上传单证</h2></div>
          <form id="upload-form" class="form-row">
            <label>上传位置<select name="target" id="upload-target"><option value="new">新任务</option><option value="replace">当前任务新版本</option></select></label>
            <label>Excel 原件<input type="file" name="file" accept=".xlsx,.xlsm,.xltx" required></label>
            <button class="primary" type="submit">上传</button>
          </form>
          <div id="duplicate-area" hidden><span>该文件与已有版本相同。</span><button id="duplicate-confirm" type="button">确认创建新版本</button></div>
        </section>
        <section id="task-detail" hidden></section>
        <section id="run-detail" hidden></section>
        <section id="item-area" hidden><div class="section-heading"><h2>商品明细</h2></div><div id="item-list"></div></section>
        <section id="item-detail" hidden></section>
        <section id="history-area" hidden></section>
      </div>
    </div>
  </main>
  <script type="module" src="/app/assets/production.js"></script>
</body>
</html>
