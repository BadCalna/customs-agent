/* 为上传/重审预置演示结论（模拟自动预审输出） */
function assignDemoResults(t){
  t.lines.forEach((l,idx)=>{
    // 保留原供应商编码；按演示规则给出 AI 结论
    if(!l.supplierCode){l.verdict='missing';l.verdictConf='low';l.aiCode=l.aiCode||'9026201000';
      l.aiReason='原表海关编码为空，系统无法形成比较；按商品事实初判。';l.aiGap='请供应商补填海关编码与关键参数。';}
    else if(idx===1){l.verdict='unsure';l.verdictConf='mid';l.aiCode=l.supplierCode;
      l.aiReason='编码方向一致，但关键归类参数不足，暂不能形成唯一结论。';l.aiGap='需补充驱动方式 / 专用性等关键事实。';}
    else{l.verdict='match';l.verdictConf='high';l.aiCode=l.supplierCode;
      l.aiReason='按商品事实独立归类后与供应商原码一致，依据充分。';l.aiGap='已具备关键归类事实。';}
    if(!l.evidence||!l.evidence.length)l.evidence=['E1'];
    if(!l.elements||!l.elements.length)l.elements=[{name:'品名',orig:l.name,ai:l.name,img:'可见',state:'ok'}];
  });
}

/* ---------------------------- 导出 & toast ---------------------------- */
/* 本页是原型数据模型：任务与商品行都由 mapDataset() 生成，没有真实的 version_id /
   run_id / submission_id，因此无法组成契约要求的“结果集属于请求版本”的导出请求。
   这里只说明现状，绝不生成 CSV/XLSX 之类的假文件、也不提示导出成功。 */
const EXPORT_MOVED='导出入口已迁移到上传/任务页（/uploads/、/tasks/）：本页是原型数据，没有可引用的真实执行';
function exportControl(){
  if(window.WB_MODE==='live')
    return `<button class="btn" disabled aria-disabled="true" title="${EXPORT_MOVED}">${svg('download',14)} 导出补料清单</button>
      <span class="tag">导出已迁至上传/任务页</span>`;
  return `<button class="btn" data-act="export" title="样例模式不生成文件">${svg('download',14)} 导出补料清单</button>`;
}
function exportUnavailable(){
  if(window.WB_MODE==='live'){toast(EXPORT_MOVED);return;}
  toast('样例模式（FIXTURE/DEMO）不可导出真实文件；请在 LIVE 模式的上传/任务页导出 xlsx');
}
let toastTimer=null;
function toast(msg,undo){
  const el=$('#toast');
  el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button class="undo-btn" id="toast-undo">${esc(undo.label)}</button>`:''}`;
  if(undo){$('#toast-undo').addEventListener('click',()=>{undo.fn();hideToast();});}
  requestAnimationFrame(()=>el.classList.add('show'));
  clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,undo?5000:2800);
}
function hideToast(){const el=$('#toast');el.classList.remove('show');}

/* ---------------------------- 渲染 ---------------------------- */
function render(){
  const role=roleOf();const r=parseRoute();const root=document.getElementById('root');
  if(!role){root.innerHTML=viewGate();return;}
  S.role=role;
  if(r.seg==='supplier'){root.innerHTML=(r.a==='task'&&r.b)?viewSupplierTask(task(r.b)):viewSupplierTasks();return;}
  if(r.seg==='business'){
    if(r.a==='overview')root.innerHTML=viewBusinessOverview();
    else if(r.a==='task'&&r.b)root.innerHTML=viewTask('business',task(r.b),r.c||'');
    else root.innerHTML=viewBusinessTasks();return;}
  if(r.seg==='expert'){
    if(r.a==='archive')root.innerHTML=viewExpertArchive();
    else if(r.a==='task'&&r.b)root.innerHTML=viewTask('expert',task(r.b),r.c||'');
    else root.innerHTML=viewExpertQueue();}
}
/* ---------------------------- 数据桥接（Django Ninja / 契约样例 / 本地演示） ---------------------------- */
const CMP={consistent:'match',inconsistent:'mismatch',needs_confirmation:'unsure',supplier_missing:'missing',supplier_invalid:'invalid',association_error:'relation'};
const fmtDT=s=>{if(!s)return '';return String(s).replace('T',' ').slice(0,16);};
const confLevel=x=>x==null?null:(x>=0.8?'high':x>=0.5?'mid':'low');
function mapChecks(card){
  const es=card.evidence_status, im=card.image_status;
  return [
    {name:'编码与要素对应',state:card.comparison_status==='consistent'?'ok':'q',note:'按申报要素与官方模板比对'},
    {name:'图片可见事实',state:im==='available'?'ok':im==='read_failed'?'no':'q',note:im==='available'?'附图已提取，可见事实核对':im==='read_failed'?'读图失败，单独提示':'无附图，不能据图核对'},
    {name:'退税率适用',state:'q',note:'以适用日期官方退税率文库为准，未取得显示待核'},
    {name:'归类法规引用',state:es==='obtained'?'ok':'q',note:es==='obtained'?'依据已取得':'依据未核清，降级处理'},
    {name:'两用物项与监管',state:'q',note:'结合技术参数与用途核查，不以关键词排除'}
  ];
}
function mapLine(it,card,t){
  card=card||{};
  const verdict=CMP[it.comparison_status]||null;
  const ev={},evIds=[];
  (card.evidence||[]).forEach((e,i)=>{const id=it.item_id+'-e'+i;evIds.push(id);
    ev[id]={type:e.source_type==='synthetic'?'合成样例':(e.source_type||'依据'),status:e.status==='obtained'?'已核':'待核',title:e.title||'',locator:e.locator||'',eff:e.effective_from||'—',queried:String(e.retrieved_at||'').slice(0,10),quote:e.excerpt||e.note||'',url:e.url||null};});
  const attrs=(card.facts&&card.facts.attributes)||{};
  const elements=Object.entries(attrs).map(([k,v])=>({name:k,orig:String(v),ai:String(v),img:'—',state:'ok'}));
  const issues=(card.issues||[]).map(x=>x.message||x.note||'').filter(Boolean);
  const submitted=it.submitted_hs||it.business_confirmed_hs;
  const expertFinal=it.expert_final_hs;
  const loc=it.source_location||{};
  return {
    id:it.item_id,no:String(loc.row_number||''),name:it.name,alias:it.name,
    spec:attrs['规格型号']||'—',model:attrs['规格型号']||'—',material:attrs['材质']||'—',usage:attrs['用途']||'—',qty:'—',
    supplierCode:it.supplier_hs_raw||'',position:(loc.sheet_name||'申报要素')+' · 第 '+(loc.row_number||'')+' 行',
    boxNo:'—',photo:(card.images&&card.images[0]&&card.images[0].status==='available')?(card.images[0].dispimg_id||'IMG'):'—',
    aiCode:it.precheck_suggested_hs||null,aiConf:confLevel(card.confidence),verdict,verdictConf:confLevel(card.confidence),
    aiReason:verdict==='match'?'独立归类后与供应商原码一致，依据充分。':(issues[0]||'按商品事实独立归类后与供应商原码比较。'),
    aiGap:issues.join('；')||(verdict==='match'?'':'需补充关键归类信息。'),
    evidence:evIds,_ev:ev,
    elements:elements.length?elements:[{name:'品名',orig:it.name,ai:it.name,img:'—',state:'ok'}],
    special:'',
    decision:submitted?{code:submitted,at:fmtDT(t.updated_at),by:'业务员',note:'提交值'}:null,
    expert:expertFinal?{done:true,result:'pass',confidence:confLevel(card.confidence),note:'专家确认',code:expertFinal,at:fmtDT(t.updated_at),checks:mapChecks(card)}:{done:false,result:null,checks:mapChecks(card),confidence:confLevel(card.confidence),note:'',issues:[]}
  };
}
function mapDataset(data){
  const evidence={};
  const tasks=(data.tasks||[]).map(t=>{
    const vid=t.current_version_id;
    const items=(data.items||{})[vid]||[];
    const lines=items.map(it=>{const l=mapLine(it,(data.cards||{})[it.item_id],t);Object.assign(evidence,l._ev);delete l._ev;return l;});
    const sup=typeof t.supplier==='string'?t.supplier:((t.supplier&&t.supplier.name)||'');
    return {
      id:t.task_id,contract:t.title,supplier:sup,project:'',owner:'',createdAt:fmtDT(t.created_at),updatedAt:fmtDT(t.updated_at),
      versions:(t.versions||[]).map(v=>({v:v.number,file:v.original_filename,size:'—',at:fmtDT(v.uploaded_at),by:'供应商',version_id:v.version_id})),
      prechecked:!['uploaded','prechecking'].includes(t.stage),precheckAt:fmtDT(t.updated_at),
      submitted:['submitted','approved'].includes(t.stage)||!!t.current_submission_id,submittedAt:fmtDT(t.updated_at),
      approvedAt:t.stage==='approved'?fmtDT(t.updated_at):null,
      lines,
      log:[{at:fmtDT(t.created_at),by:'供应商',role:'供应商',act:'上传',desc:(t.versions||[]).map(v=>'V'+v.number).join(' / ')},
           {at:fmtDT(t.updated_at),by:'系统',role:'系统',act:'自动预审',desc:'解析成功后自动触发。',auto:true}]
    };
  });
  return {role:null,ui:{tab:'hs',task:null,filter:'all',query:'',sort:null,selected:[],collapsed:[]},tasks,evidence};
}
async function loadFixture(){
  const r=await fetch('/demo/fixtures/DEMO-SET.json');if(!r.ok)throw new Error('fixture '+r.status);
  return r.json();
}
async function loadLive(){
  const base='/api/v1';const opt={credentials:'same-origin'};
  const tj=await fetch(base+'/tasks?limit=100',opt);if(!tj.ok)throw new Error('live '+tj.status);
  const tasks=(await tj.json()).items||[];const items={},cards={};
  for(const t of tasks){const vid=t.current_version_id;if(!vid)continue;
    const ij=await fetch(base+'/versions/'+encodeURIComponent(vid)+'/items?limit=200',opt);
    if(ij.ok){items[vid]=(await ij.json()).items||[];
      for(const it of items[vid]){const cj=await fetch(base+'/versions/'+encodeURIComponent(vid)+'/items/'+encodeURIComponent(it.item_id),opt);if(cj.ok)cards[it.item_id]=await cj.json();}}}
  return {tasks,items,cards};
}
function detectMode(){
  const q=new URLSearchParams(location.search).get('mode');
  if(q==='live'||q==='fixture'||q==='demo')return q;
  // 独立演示入口默认样例数据；真实读/审批接通后再切 LIVE 并设为首页。
  return location.protocol==='file:'?'demo':'fixture';
}
function modeLabel(){
  const m=window.WB_MODE||'demo';
  return m==='live'?'真实接口 · LIVE':m==='fixture'?'契约样例 · FIXTURE':'本地演示 · DEMO';
}

/* ---------------------------- 启动 ---------------------------- */
(async function boot(){
  const r=parseRoute();
  if(r.seg==='supplier'||r.seg==='business'||r.seg==='expert')S.role=r.seg;
  document.body.classList.toggle('prod',!!(S.ui&&S.ui.prod));
  let mode=detectMode();
  if(mode!=='demo'){
    try{
      const data=mode==='live'?await loadLive():await loadFixture();
      if(!data.tasks||!data.tasks.length)throw new Error('empty');
      const role=S.role;S=mapDataset(data);S.role=role;
    }catch(e){
      if(mode==='live'){try{const data=await loadFixture();const role=S.role;S=mapDataset(data);S.role=role;mode='fixture';}catch(e2){mode='demo';}}
      else mode='demo';
    }
  }
  window.WB_MODE=mode;
  render();
})();
