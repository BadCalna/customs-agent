async function allPages(read){
  const rows=[],seen=new Set();let cursor;
  do{const page=await read(cursor);if(!Array.isArray(page.items))throw new Error('列表响应缺少 items');rows.push(...page.items);cursor=page.next_cursor;
    if(cursor&&seen.has(cursor))throw new Error('分页游标重复，请刷新后重试');if(cursor)seen.add(cursor);
  }while(cursor);
  return rows;
}
async function loadLive(){
  const route=parseRoute(),entries=await allPages(cursor=>API.listTasks({limit:100,cursor}));
  const tasks=[],items={},cards={},histories={};
  for(const entry of entries){
    const [t,h]=await Promise.all([API.getTask(entry.task_id),API.taskHistory(entry.task_id)]);
    const vid=route.b===t.task_id&&route.version?route.version:t.current_version_id;
    if(vid&&!(t.versions||[]).some(v=>v.version_id===vid))throw new Error('请求的版本不属于当前任务');
    t.view_version_id=vid;tasks.push(t);histories[t.task_id]=h;
    if(!vid)continue;
    items[vid]=await allPages(cursor=>API.listItems(vid,{limit:100,cursor}));
    if(route.b===t.task_id&&route.c&&!items[vid].some(i=>i.item_id===route.c))throw new Error('问题商品不属于所选版本');
    // 限制单批卡片并发，任何一张卡读取失败都显示错误，禁止用不完整数据提交。
    for(let i=0;i<items[vid].length;i+=8){
      await Promise.all(items[vid].slice(i,i+8).map(async it=>{cards[it.item_id]=await API.getItem(vid,it.item_id);}));
    }
  }
  return {tasks,items,cards,histories};
}

function errorText(error){
  const status=error.status?`（HTTP ${error.status} · ${error.code||'error'}）`:'';
  const hint=error.status===401?'登录已失效，请退出后重新登录。':error.status===409?'数据已变化，请刷新核对后再操作。':error.status===403?'请检查账号权限或重新登录后重试。':'';
  return `${error.message||'网络请求失败，请检查连接后重试'}${status} ${hint}${error.requestId?' 请求编号：'+error.requestId:''}`;
}
async function startLive(){
  WB.loading=true;render();
  try{
    WB.user=await API.me();
    const uid=WB.user?(WB.user.username||WB.user.user_id||''):'';
    if(uid&&uid!==WB.lastUserId){S.ui=defaultUi();WB.lastUserId=uid;}
    if(WB.user)await reloadLive();
  }
  catch(error){if(error.status===401){WB.user=null;WB.error='';}else{WB.error='真实数据读取失败：'+errorText(error);WB.stale=true;}}
  finally{WB.loading=false;render();}
}
let liveLoadSequence=0,liveRouteSequence=0;
async function reloadLive(){
  const sequence=++liveLoadSequence,data=await loadLive(),ui=S.ui||defaultUi();

  S=mapDataset(data);S.ui=ui;S.role=roleOf();WB.error='';WB.stale=false;
}
async function refreshLiveRoute(){
  const sequence=++liveRouteSequence;WB.loading=true;render();

  catch(error){if(sequence===liveRouteSequence){WB.error='真实数据读取失败：'+errorText(error);WB.stale=true;}}

}

async function saveLive(write,check,message){

      const payload={action:approve?'approve':'return',revision:t.revision,reason,items:[],issues:[]};
      if(approve){payload.items=t.lines.map(l=>{const final_hs=$(`[data-final="${l.id}"]`).value.trim(),change_reason=$(`[data-change-reason="${l.id}"]`).value.trim();if(!/^\d{10}$/.test(final_hs))throw new Error(l.name+'：最终编码必须为 10 位数字');if(final_hs!==l.submittedCode&&!change_reason)throw new Error(l.name+'：调整提交编码必须填写改码理由');return {item_id:l.id,final_hs,change_reason};});}
      else{const message=$('#live-issue-message').value.trim();if(!reason||!message)throw new Error('请填写退回理由与具体问题');payload.return_to=$('#live-return-to').value;payload.issues=[{item_id:$('#live-issue-item').value,message}];}
      await saveLive(()=>API.decideSubmission(t.submissionId,payload,operationKey('decide',t.submissionId,payload)),out=>{requireResult(out,{task_id:t.id,version_id:t.currentVersionId,submission_id:t.submissionId,action:payload.action,submission_status:approve?'approved':'returned'});if(!out.decision_id)throw new Error('裁决回执缺少标识');if(!approve&&(!out.issues?.length||!out.issues.every(i=>i.version_id===t.currentVersionId&&i.submission_id===t.submissionId&&i.item_id===payload.issues[0].item_id)))throw new Error('退回问题回执缺少版本或商品归属');},approve?'专家整批通过已由服务端保存':'专家退回及问题已由服务端保存');return true;
    }
    if(act==='live-history'||act==='open-history'){liveHistory(t);return true;}
    if(act==='switch-version'){await locateLive(t,t.versions.find(v=>v.v===Number(el.dataset.v)).version_id);return true;}
    if(act==='live-locate'){await locateLive(t,el.dataset.version,el.dataset.line);return true;}
    toast('此操作尚未接入正式工作台，未保存任何变更。');return true;
  }catch(error){WB.error=errorText(error);preserveScroll(()=>render());toast(WB.error);return true;}
}
document.addEventListener('submit',async event=>{
  if(event.target.id!=='live-login-form')return;event.preventDefault();if(WB.pending)return;
  const username=$('#live-username').value.trim(),password=$('#live-password').value;
  WB.pending=true;WB.error='';event.target.querySelector('button').disabled=true;
  try{
    WB.user=await API.login(username,password);
    WB.lastUserId=WB.user?(WB.user.username||WB.user.user_id||''):'';
    WB.lastRouteKey='';WB.lastListRoute='';WB.pendingTab='';
    S.ui=defaultUi();
    const targetHash='#/'+defaultRoute(roleOf());
    if(location.hash!==targetHash)history.replaceState(null,'',targetHash);
    WB.loading=true;await reloadLive();
  }
  catch(error){WB.error=errorText(error);if(error.status===401)WB.user=null;else if(WB.user)WB.stale=true;}
  finally{WB.pending=false;WB.loading=false;render();if(!WB.user&&$('#live-username'))$('#live-username').value=username;}
});

/* ---------------------------- 启动 ---------------------------- */
(async function boot(){
  if(LIVE){await startLive();return;}
  const r=parseRoute();if(['supplier','business','expert'].includes(r.seg))S.role=r.seg;
  if(window.WB_MODE==='fixture'){
    try{const role=S.role;S=mapDataset(await loadFixture());S.role=role;}
    catch(error){$('#root').innerHTML=`<div class="empty" role="alert">FIXTURE 读取失败：${esc(error.message)}</div>`;return;}
  }
  render();
})();
</script>
