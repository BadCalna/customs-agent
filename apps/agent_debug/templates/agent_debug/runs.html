{% load static %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运行记录 · Agent 调试台</title><link rel="stylesheet" href="{% static 'agent_debug/debug.css' %}"></head><body data-page="runs"><header class="topbar"><a class="brand" href="/ops/debug/"><span class="brand-mark">◎</span><span>OPS / DEBUG</span></a><nav><a href="/ops/debug/">调试台</a><a href="/ops/debug/connections/">模型连接</a><a class="active" href="/ops/debug/runs/">运行记录</a></nav><span class="session-dot">● 会话安全</span></header><main class="shell"><section class="hero compact"><div><p class="eyebrow">CONTROL ROOM · 03</p><h1>运行记录<span class="accent-dot">.</span></h1><p class="lede">默认只显示本人最近 7 天。技术状态和业务结论分开呈现。</p></div><div class="hero-stamp"><span>RETENTION</span><strong>90 DAYS / META</strong></div></section><section class="panel"><div class="toolbar"><div class="filters"><select id="stage" aria-label="筛选调试阶段"><option value="">全部阶段</option><option value="precheck">独立预审</option><option value="expert_check">专家核查</option></select><select id="state"><option value="">全部状态</option><option value="succeeded">已完成</option><option value="failed">失败</option><option value="running">运行中</option></select><select id="mode"><option value="">全部模式</option><option value="mock">MOCK</option><option value="live">LIVE</option></select><select id="error_code"><option value="">全部错误</option></select><input id="date_from" type="date"><input id="date_to" type="date"><input id="id" placeholder="按运行号筛选"><input id="cursor" type="hidden"></div><div class="toolbar-actions"><button class="button ghost" id="resetRuns" type="button">重置筛选</button><button class="button ghost" id="refreshRuns" type="button">↻ 刷新</button></div></div><div id="runsTable" class="table-wrap"><div class="skeleton"></div></div></section></main><script src="{% static 'agent_debug/debug.js' %}"></script></body></html>
