{% load static %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型连接 · Agent 调试台</title><link rel="stylesheet" href="{% static 'agent_debug/debug.css' %}"></head><body data-page="connections"><header class="topbar"><a class="brand" href="/ops/debug/"><span class="brand-mark">◎</span><span>OPS / DEBUG</span></a><nav><a href="/ops/debug/">调试台</a><a class="active" href="/ops/debug/connections/">模型连接</a><a href="/ops/debug/runs/">运行记录</a></nav><span class="session-dot">● 会话安全</span></header><main class="shell"><section class="hero compact"><div><p class="eyebrow">CONTROL ROOM · 02</p><h1>模型连接<span class="accent-dot">.</span></h1><p class="lede">仅管理员可见。每次保存都会生成新的 revision，Key 永不回显。</p></div><button class="button primary" id="newConnection">＋ 新建连接</button></section><section class="panel"><div class="panel-head"><div><span class="section-no">REGISTERED ENDPOINTS</span><h2>已登记连接</h2></div><span id="connectionCount" class="muted">读取中…</span></div><div id="connectionsTable" class="table-wrap"><div class="skeleton"></div></div></section></main><div id="connectionDialog" class="dialog-backdrop" hidden><div class="dialog"><button class="dialog-close" id="closeDialog">×</button><span class="section-no">NEW REVISION</span><h2>添加模型连接</h2><p class="muted">目标必须来自运维登记清单，不能输入任意 URL。</p><form id="connectionForm"><label>连接别名<input name="alias" required maxlength="80"></label><label>目标端点<select name="endpoint_id" id="endpointSelect" required></select></label><label>模型 ID<input name="model" required maxlength="120"></label><label>鉴权模式<select name="auth_mode"><option value="none">无鉴权</option><option value="bearer">Bearer Key</option></select></label><label>新 Key <span class="muted">（可选）</span><input name="api_key" type="password" autocomplete="new-password"></label><label class="secret-copy"><input name="copy_secret_from" type="checkbox" value=""> 复用当前 revision 的 secret（仅同一获批端点 / 模型）</label><div class="form-foot"><button class="button ghost" type="button" id="cancelDialog">取消</button><button class="button primary" type="submit">保存草稿 →</button></div></form><p id="connectionFeedback" class="feedback"></p></div></div><script src="{% static 'agent_debug/debug.js' %}"></script></body></html>
