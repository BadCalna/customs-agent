# 云端测试环境的 nginx 入口配置（HTTP）。
# 容器内只监听 80；对外端口由 compose 的 CUSTOMS_HTTP_PORT 决定。
# 有域名和证书后，改用 nginx/https.conf.example 的写法（见 deploy/README.md 第 6 节）。

# 保留客户端 Host 的外部端口；旧式无 Host 请求才回退到 nginx 解析值。
map $http_host $customs_forwarded_host {
    default $http_host;
    "" $host;
}

server {
    listen 80 default_server;
    server_name _;

    # 与 CUSTOMS_FILE_MAX_BYTES（默认 100MB）留出余量，避免大文件上传被 nginx 用 413 拦掉。
    client_max_body_size 110m;

    # 静态文件：migrate 服务 collectstatic 写进 static 卷，这里只读提供。
    # DEBUG 关闭后 Django 不再自己服务 /static/，admin 的样式就靠这一段。
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 1h;
    }

    # compose healthcheck 用；不暴露业务信息。
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $customs_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # settings_cloud 的 SECURE_PROXY_SSL_HEADER 依赖这个头；HTTPS 时由 nginx 覆盖成 https。
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传解析、导出可能较慢，和 gunicorn --timeout 120 对齐。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
